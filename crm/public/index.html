<!doctype html><html lang="en-AU"><head><meta name="color-scheme" content="light"><meta name="theme-color" content="#fbf0f3"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Heartara · Private CRM</title><link rel="stylesheet" href="/crm/crm.css"><script src="/crm/app.js" defer></script></head><body><header><a href="/crm/" class="brand"><img src="/assets/heartara-logo.jpeg" alt="Heartara" width="70" height="70"><span>Heartara<small>YOUR PRIVATE BUSINESS SPACE</small></span></a><div id="session-actions"></div></header><p id="global-status" role="status" aria-live="polite"></p><div id="login"><h1>A little space<br><em>to organise.</em></h1><p>Sign in to your private Heartara CRM.</p><form id="login-form"><label>Email<input id="login-email" type="email" autocomplete="username" required></label><label>Password<input id="login-password" type="password" autocomplete="current-password" required></label><button>Sign in</button><button type="button" class="secondary" id="recover">Reset password</button></form><form id="mfa-form" hidden><label>Authenticator code<input id="mfa-code" inputmode="numeric" pattern="[0-9]{6}" required autocomplete="one-time-code"></label><button>Verify code</button></form><form id="recovery-form" hidden><label>New password<input id="new-password" type="password" minlength="12" autocomplete="new-password" required></label><button>Save new password</button></form><p class="muted">Access is by invitation only. No public staff registration. This is not a clinical record system.</p></div><div id="workspace" hidden><nav id="crm-nav" aria-label="CRM navigation"></nav><main id="screen" tabindex="-1"></main></div><dialog id="editor"><form id="editor-form"><h2 id="editor-title"></h2><div id="editor-fields"></div><p id="editor-status" role="status"></p><div class="actions"><button type="submit">Save</button><button type="button" id="cancel-edit" class="secondary">Cancel</button></div></form></dialog></body></html>
