name: Heartara checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
        env:
          SITE_ENV: production
      - run: npm test
      - run: npm run check
      - run: node --test crm/tests/vercel.test.js crm/tests/presentation.test.js crm/tests/configuration.test.js crm/tests/forms.test.js crm/tests/email.test.js
